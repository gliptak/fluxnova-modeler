  <line x1="24" y1="14.5" x2="16" y2="18" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
  <line x1="32" y1="22.5" x2="28" y2="28" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
